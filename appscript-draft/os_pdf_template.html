<html>
<head>
  <meta charset="UTF-8">
  <style>

      margin-left: 4px;

    table {
      width: 100%;

      border-bottom: 1px solid #eee;

<body>
  <? 
    function fmtBRL(v) {
      const n = Number(v || 0);
      return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    const numeroOs = String(ordem.id || '');
    const total = itens.reduce(function(sum, item) { return sum + Number(item.total || 0); }, 0);
  ?>

  <div class="page">
    <div class="content">
      <div class="top-header">
        <? if (logoSrc) { ?>
          <img class="logo" src="<?!= logoSrc ?>">
        <? } else { ?>
          <div></div>
        <? } ?>

        <div class="company-info">
          <div class="company-name">RM Manutenções</div>
          CNPJ: 52.049.180/0001-08<br>
          Telefone: 21 96402-9828<br>
          Email: corporativormmanutencoes@gmail.com
        </div>
      </div>

      <div class="document-header">
        <h1>OS Nº <?= numeroOs ?></h1>
        <div class="document-date">Emitida em: <?= generatedAt ?></div>
      </div>

      <div class="divider"></div>

      <div class="section-title">Cliente</div>
      <div class="info-block">
        <b>Nome:</b> <?= cliente && cliente.nome ? cliente.nome : (ordem.clienteNome || '-') ?><br>
        <? if (cliente && cliente.telefone) { ?><b>Telefone:</b> <?= cliente.telefone ?><br><? } ?>
        <? if (cliente && cliente.endereco) { ?><b>Endereço:</b> <?= cliente.endereco ?><br><? } ?>
        <? if (cliente && cliente.cnpj) { ?><b>CNPJ:</b> <?= cliente.cnpj ?><br><? } ?>
      </div>

      <div class="section-title">Descrição</div>
      <div class="info-block">
        <?= ordem.descricao || '-' ?>
      </div>

      <div class="section-title">Itens / Serviços</div>

      <table>
        <tr>
          <th style="width:100px">Tipo</th>
          <th>Descrição</th>
          <th style="width:60px" class="right">Qtd</th>
          <th style="width:90px" class="right">Preço</th>
          <th style="width:90px" class="right">Total</th>
        </tr>

        <? for (let i = 0; i < itens.length; i++) { ?>
          <tr>
            <td><?= itens[i].tipo ?></td>
            <td><?= itens[i].descricao ?></td>
            <td class="right"><?= itens[i].quantidade ?></td>
            <td class="right">R$ <?= fmtBRL(itens[i].precoUnitario) ?></td>
            <td class="right">R$ <?= fmtBRL(itens[i].total) ?></td>
          </tr>
        <? } ?>
      </table>

      <div class="total-line">
        Total: R$ <?= fmtBRL(total) ?>
      </div>
    </div>

    <div class="footer-tech">
      <div class="tech-box">
        <div class="tech-line"></div>
        Técnico Responsável<br>
        <b>Rafael Monteiro</b>
      </div>
    </div>
  </div>
</body>
</html>
