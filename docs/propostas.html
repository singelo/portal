<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portal/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Propostas | RM Portal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --sidebar: #fbfcfd;
        --surface: #ffffff;
        --surface-muted: #f5f7f9;
        --text: #172033;
        --muted: #697386;
        --border: #e3e7ed;
        --border-strong: #cfd6df;
        --accent: #172033;
        --danger: #b42318;
        --danger-bg: #fff1f0;
        --radius: 16px;
        --shadow: 0 12px 34px rgba(23, 32, 51, 0.07);
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .6; }
      a { color: inherit; text-decoration: none; }
      .hidden { display: none !important; }

      .app-shell {
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        padding: 24px 16px;
      }

      .sidebar-label,
      .eyebrow,
      .brand {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
      }

      .sidebar-label { padding: 0 8px 20px; }
      .nav { display: flex; flex-direction: column; gap: 6px; }
      .nav-link {
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        transition: background .16s ease, color .16s ease, box-shadow .16s ease;
      }
      .nav-link:hover { background: var(--surface); color: var(--text); }
      .nav-link.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(23, 32, 51, .06), inset 0 0 0 1px var(--border);
      }
      .nav-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sidebar-footer { margin-top: auto; padding-top: 24px; }

      .content-column { min-width: 0; min-height: 100dvh; display: flex; flex-direction: column; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,.9);
        backdrop-filter: blur(18px);
      }
      .topbar-inner {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 32px;
      }
      .topbar-left { display: flex; align-items: center; gap: 12px; }

      .page { width: 100%; padding: 32px; }
      .page-inner { width: 100%; max-width: 1440px; margin: 0 auto; }
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      h1 { margin: 8px 0 0; font-size: clamp(26px, 3vw, 34px); line-height: 1.1; letter-spacing: -.025em; }
      .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }

      .btn {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 650;
        line-height: 1;
        white-space: nowrap;
        transition: transform .14s ease, opacity .14s ease, border-color .14s ease, background .14s ease;
      }
      .btn:hover { border-color: var(--border-strong); background: #fafbfc; }
      .btn:active { transform: translateY(1px); }
      .btn-primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 18px rgba(23, 32, 51, .13);
      }
      .btn-primary:hover { background: #222d43; border-color: #222d43; }
      .btn-icon { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .btn-wide { width: 100%; }
      .icon-only { width: 40px; height: 40px; padding: 0; }

      .card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .card-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--border); }
      .card-head h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
      .card-head p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
      .toolbar { padding: 18px 24px; border-bottom: 1px solid var(--border); background: #fcfdfe; }
      .search-wrap { position: relative; max-width: 620px; }
      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        width: 17px;
        height: 17px;
        transform: translateY(-50%);
        stroke: var(--muted);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .field {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        background: var(--surface);
        color: var(--text);
        padding: 10px 13px;
        transition: border-color .14s ease, box-shadow .14s ease;
      }
      .field-search { padding-left: 42px; }
      .field:focus { border-color: #9aa7b7; box-shadow: 0 0 0 3px rgba(23,32,51,.06); }
      .field::placeholder { color: #98a2b3; }

      .message { margin: 18px 24px 0; border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; font-size: 13px; }
      .message.error { color: var(--danger); border-color: #f2c8c4; background: var(--danger-bg); }
      .message.info { color: var(--text); background: var(--surface-muted); }

      .table-wrap { width: 100%; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      thead th {
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        background: #fafbfc;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .09em;
        text-align: left;
        text-transform: uppercase;
      }
      tbody td { padding: 17px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #fcfdfe; }
      .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
      .muted { color: var(--muted); }
      .cell-action { text-align: right; }
      .empty-state { padding: 44px 24px; text-align: center; color: var(--muted); font-size: 14px; }
      .loading-dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: currentColor; opacity: .55; }

      .mobile-menu { display: none; }
      .drawer-backdrop,
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(16, 24, 40, .28);
        backdrop-filter: blur(5px);
      }
      .drawer {
        width: min(88vw, 320px);
        height: 100%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        padding: 16px;
        box-shadow: 24px 0 60px rgba(16,24,40,.16);
      }
      .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .drawer-title { margin: 0; font-size: 14px; font-weight: 700; }

      .modal-backdrop { z-index: 60; display: flex; align-items: center; justify-content: center; padding: 18px; }
      .modal {
        width: min(100%, 590px);
        max-height: calc(100dvh - 36px);
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 28px 80px rgba(16,24,40,.2);
        padding: 24px;
      }
      .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .modal h2 { margin: 0; font-size: 19px; }
      .modal-copy { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
      .form { display: grid; gap: 17px; margin-top: 24px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .form-group { display: grid; gap: 8px; }
      .form-group label, .field-label { color: var(--text); font-size: 13px; font-weight: 650; }
      .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px; }
      .form-error { border: 1px solid #f2c8c4; border-radius: 13px; background: var(--danger-bg); color: var(--danger); padding: 12px 14px; font-size: 13px; }

      @media (max-width: 1023px) {
        .app-shell { display: block; }
        .sidebar { display: none; }
        .mobile-menu { display: inline-flex; }
        .topbar-inner { padding: 14px 20px; }
        .page { padding: 26px 20px; }
      }

      @media (max-width: 720px) {
        .topbar-inner { min-height: 64px; padding: 12px 16px; }
        .page { padding: 22px 16px; }
        .page-head { align-items: stretch; flex-direction: column; gap: 18px; margin-bottom: 20px; }
        .actions { width: 100%; }
        .actions .btn { flex: 1 1 0; }
        .card-head, .toolbar { padding-left: 18px; padding-right: 18px; }
        .message { margin-left: 18px; margin-right: 18px; }
        thead { display: none; }
        table, tbody, tr, td { display: block; width: 100%; }
        tbody { padding: 6px 14px 14px; }
        tbody tr {
          margin-top: 10px;
          border: 1px solid var(--border);
          border-radius: 14px;
          background: var(--surface);
          padding: 14px;
        }
        tbody td { border: 0; padding: 4px 0; }
        tbody tr:hover { background: var(--surface); }
        .file-name { white-space: normal; overflow-wrap: anywhere; margin-bottom: 4px; }
        .cell-action { padding-top: 10px; text-align: left; }
        .cell-action .btn { width: 100%; }
        .form-grid { grid-template-columns: 1fr; }
        .form-actions { flex-direction: column-reverse; }
        .form-actions .btn { width: 100%; }
        .modal { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <p class="sidebar-label">Navegação</p>
        <nav class="nav" id="desktop-nav"></nav>
        <div class="sidebar-footer">
          <button id="logout" class="btn btn-wide" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Encerrar sessão
          </button>
        </div>
      </aside>

      <div class="content-column">
        <header class="topbar">
          <div class="topbar-inner">
            <div class="topbar-left">
              <button id="mobile-menu" class="btn icon-only mobile-menu" type="button" aria-label="Abrir navegação">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
              <p class="brand">RM Portal</p>
            </div>
            <a href="/portal/#/orcamentos" class="btn">Voltar ao portal</a>
          </div>
        </header>

        <main class="page">
          <div class="page-inner">
            <div class="page-head">
              <div>
                <p class="eyebrow">Comercial</p>
                <h1>Propostas</h1>
                <p class="subtitle">Gere propostas comerciais e consulte os PDFs já emitidos.</p>
              </div>
              <div class="actions">
                <button id="refresh" class="btn" type="button">
                  <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
                  Atualizar
                </button>
                <button id="open-generate" class="btn btn-primary" type="button">
                  <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                  Nova proposta
                </button>
              </div>
            </div>

            <section class="card">
              <div class="card-head">
                <h2>Arquivos de propostas</h2>
                <p>PDFs de propostas comerciais salvos no Drive.</p>
              </div>

              <div class="toolbar">
                <div class="search-wrap">
                  <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                  <input id="search" class="field field-search" placeholder="Buscar por nome do arquivo" autocomplete="off" />
                </div>
              </div>

              <div id="message" class="message hidden"></div>
              <div id="files" class="table-wrap" aria-live="polite"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="mobile-drawer" class="drawer-backdrop hidden">
      <div class="drawer">
        <div class="drawer-head">
          <p class="drawer-title">RM Portal</p>
          <button id="mobile-close" class="btn icon-only" type="button" aria-label="Fechar navegação">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <nav class="nav" id="mobile-nav"></nav>
      </div>
    </div>

    <div id="generate-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="generate-title">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2 id="generate-title">Nova proposta</h2>
            <p class="modal-copy">Documento comercial separado do orçamento.</p>
          </div>
          <button id="close-generate" class="btn icon-only" type="button" aria-label="Fechar">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="form">
          <div class="form-group">
            <span class="field-label">Cliente</span>
            <select id="cliente" class="field">
              <option value="">Carregando clientes...</option>
            </select>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <span class="field-label">Valor</span>
              <input id="valor" class="field" inputmode="decimal" placeholder="550,00" autocomplete="off" />
            </div>
            <div class="form-group">
              <span class="field-label">Prazo</span>
              <select id="prazo" class="field">
                <option value="24">24 horas</option>
                <option value="72">72 horas</option>
              </select>
            </div>
          </div>

          <div id="form-error" class="form-error hidden"></div>

          <div class="form-actions">
            <button id="cancel-generate" class="btn" type="button">Cancelar</button>
            <button id="generate" class="btn btn-primary" type="button">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Gerar PDF
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'https://red-bush-f22b.mauriciosingelo.workers.dev';
      const TOKEN_KEY = 'rm_token';
      const EXPIRES_KEY = 'rm_expires_at';
      let allFiles = [];

      const icons = {
        dashboard: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
        clientes: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2"/><path d="M16 4.5a4 4 0 0 1 0 7"/><path d="M18 15a5 5 0 0 1 3 4.6V21"/></svg>',
        estoque: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4"/><path d="m4 17 8 4 8-4"/></svg>',
        financeiro: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>',
        os: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.2 2.2-3-3 2.2-2.2Z"/></svg>',
        orcamentos: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>',
        propostas: '<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/><path d="M8 9h2"/></svg>'
      };

      const navItems = [
        ['Dashboard', '/portal/#/', icons.dashboard],
        ['Clientes', '/portal/#/clientes', icons.clientes],
        ['Estoque', '/portal/#/estoque', icons.estoque],
        ['Financeiro', '/portal/#/financeiro', icons.financeiro],
        ['Ordens de serviço', '/portal/#/ordens-servico', icons.os],
        ['Orçamentos', '/portal/#/orcamentos', icons.orcamentos],
        ['Propostas', '/portal/propostas.html', icons.propostas],
      ];

      function renderNav(target) {
        target.innerHTML = navItems.map(([label, href, icon]) => {
          const active = label === 'Propostas';
          return `<a href="${href}" class="nav-link${active ? ' active' : ''}">${icon}<span>${label}</span></a>`;
        }).join('');
      }

      renderNav(document.getElementById('desktop-nav'));
      renderNav(document.getElementById('mobile-nav'));

      async function apiRequest(action, payload = {}) {
        const token = localStorage.getItem(TOKEN_KEY) || '';
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, token, ...payload }),
        });

        const text = await response.text();
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch {
          throw new Error('A API retornou uma resposta inválida.');
        }

        if (!parsed.ok) {
          const errorMessage = parsed.error && parsed.error.message ? parsed.error.message : 'Erro na API.';
          if (/sess[aã]o (inv[aá]lida|expirada)/i.test(errorMessage)) {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(EXPIRES_KEY);
            location.href = '/portal/#/login';
          }
          throw new Error(errorMessage);
        }

        return parsed.data;
      }

      function showMessage(message, kind = 'error') {
        const box = document.getElementById('message');
        box.textContent = message;
        box.className = `message ${kind === 'error' ? 'error' : 'info'}`;
      }

      function hideMessage() {
        const box = document.getElementById('message');
        box.textContent = '';
        box.className = 'message hidden';
      }

      function formatFileDate(value) {
        if (!value) return 'Sem data';
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return String(value);
        return parsed.toLocaleString('pt-BR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      }

      function formatFileSize(value) {
        const bytes = Number(value || 0);
        if (!bytes) return '—';
        if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        if (bytes >= 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${bytes} B`;
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[char]);
      }

      function escapeAttribute(value) { return escapeHtml(value); }

      function renderFiles() {
        const term = document.getElementById('search').value.trim().toLowerCase();
        const files = allFiles.filter((file) => !term || [file.name, file.createdAt, file.updatedAt].join(' ').toLowerCase().includes(term));
        const target = document.getElementById('files');

        if (!files.length) {
          target.innerHTML = '<div class="empty-state">Nenhuma proposta encontrada.</div>';
          return;
        }

        target.innerHTML = `
          <table>
            <colgroup>
              <col style="width:48%" />
              <col style="width:25%" />
              <col style="width:12%" />
              <col style="width:15%" />
            </colgroup>
            <thead>
              <tr>
                <th>Arquivo</th>
                <th>Atualizado</th>
                <th>Tamanho</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${files.map((file) => `
                <tr>
                  <td><div class="file-name">${escapeHtml(file.name || 'Proposta')}</div></td>
                  <td class="muted">${escapeHtml(formatFileDate(file.updatedAt || file.createdAt))}</td>
                  <td class="muted">${escapeHtml(formatFileSize(file.sizeBytes))}</td>
                  <td class="cell-action">
                    <a href="${escapeAttribute(file.url || '#')}" target="_blank" rel="noopener noreferrer" class="btn">
                      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                      Abrir
                    </a>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      async function loadFiles() {
        hideMessage();
        const target = document.getElementById('files');
        target.innerHTML = '<div class="empty-state"><span class="loading-dot"></span>Carregando propostas...</div>';
        try {
          const data = await apiRequest('propostas.list');
          allFiles = Array.isArray(data) ? data : [];
          renderFiles();
        } catch (error) {
          allFiles = [];
          renderFiles();
          showMessage(error.message || 'Erro ao carregar propostas.');
        }
      }

      async function loadClientes() {
        const select = document.getElementById('cliente');
        select.innerHTML = '<option value="">Carregando clientes...</option>';
        try {
          const data = await apiRequest('clientes.list');
          const clientes = Array.isArray(data) ? data : [];
          select.innerHTML = '<option value="">Selecione um cliente</option>' + clientes.map((cliente) => {
            const id = cliente.id != null ? cliente.id : cliente.id_cliente;
            return `<option value="${escapeAttribute(id)}">${escapeHtml(cliente.nome || '-')}</option>`;
          }).join('');
        } catch (error) {
          select.innerHTML = '<option value="">Erro ao carregar clientes</option>';
          showFormError(error.message || 'Erro ao carregar clientes.');
        }
      }

      function openGenerate() {
        document.getElementById('generate-modal').classList.remove('hidden');
        document.getElementById('form-error').classList.add('hidden');
        loadClientes();
      }

      function closeGenerate() {
        document.getElementById('generate-modal').classList.add('hidden');
      }

      function showFormError(message) {
        const box = document.getElementById('form-error');
        box.textContent = message;
        box.classList.remove('hidden');
      }

      function maskCurrency(value) {
        const digits = String(value || '').replace(/\D/g, '');
        if (!digits) return '';
        return (Number(digits) / 100).toLocaleString('pt-BR', {
          minimumFractionDigits: 2, maximumFractionDigits: 2
        });
      }

      async function generateProposal() {
        const clienteId = document.getElementById('cliente').value;
        const valor = document.getElementById('valor').value.trim();
        const prazo = document.getElementById('prazo').value;
        const button = document.getElementById('generate');

        if (!clienteId) return showFormError('Selecione um cliente.');
        if (!valor) return showFormError('Informe o valor da proposta.');
        if (!prazo) return showFormError('Selecione o prazo.');

        document.getElementById('form-error').classList.add('hidden');
        button.disabled = true;
        button.textContent = 'Gerando...';

        try {
          const data = await apiRequest('propostas.generate', { payload: { clienteId, valor, prazo } });
          const url = typeof data === 'string' ? data : data && data.url;
          if (!url) throw new Error('A API não retornou a URL do PDF.');
          window.open(url, '_blank', 'noopener,noreferrer');
          document.getElementById('valor').value = '';
          closeGenerate();
          await loadFiles();
        } catch (error) {
          showFormError(error.message || 'Erro ao gerar proposta.');
        } finally {
          button.disabled = false;
          button.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Gerar PDF';
        }
      }

      document.getElementById('search').addEventListener('input', renderFiles);
      document.getElementById('refresh').addEventListener('click', loadFiles);
      document.getElementById('open-generate').addEventListener('click', openGenerate);
      document.getElementById('close-generate').addEventListener('click', closeGenerate);
      document.getElementById('cancel-generate').addEventListener('click', closeGenerate);
      document.getElementById('generate').addEventListener('click', generateProposal);
      document.getElementById('valor').addEventListener('input', (event) => { event.target.value = maskCurrency(event.target.value); });
      document.getElementById('mobile-menu').addEventListener('click', () => document.getElementById('mobile-drawer').classList.remove('hidden'));
      document.getElementById('mobile-close').addEventListener('click', () => document.getElementById('mobile-drawer').classList.add('hidden'));
      document.getElementById('mobile-drawer').addEventListener('click', (event) => {
        if (event.target.id === 'mobile-drawer') document.getElementById('mobile-drawer').classList.add('hidden');
      });
      document.getElementById('generate-modal').addEventListener('click', (event) => {
        if (event.target.id === 'generate-modal') closeGenerate();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeGenerate();
          document.getElementById('mobile-drawer').classList.add('hidden');
        }
      });
      document.getElementById('logout').addEventListener('click', async () => {
        try { await apiRequest('auth.logout'); } catch (_) {}
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(EXPIRES_KEY);
        location.href = '/portal/#/login';
      });

      if (!localStorage.getItem(TOKEN_KEY)) {
        location.replace('/portal/#/login');
      } else {
        loadFiles();
      }
    </script>
  </body>
</html>
